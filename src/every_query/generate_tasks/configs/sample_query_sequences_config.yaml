# Hydra config for the conditional query-*sequence* label generator.
#
# Sweep with:
#   EQ_generate_query_sequences -m input_shard=0,1,2,... task_shard=range(0,K)
#
# Path roots follow the same `.env` fallback convention as `sample_tasks_config.yaml`:
#   data_dir  -> $INTERMEDIATE   (event shards live under `{data_dir}/data/{split}/*.parquet`)
#   out_dir   -> $TASK_DIR       (labeled shards land as {split}/*.parquet; consumable as
#                                 MTD's task_labels_dir directly)
#   query_codes: null -> $PROCESSED/metadata/codes.parquet

data_dir: null
out_dir: null
query_codes: null

split: train
input_shard: "0"
task_shard: 0
seed: 1

# Number of patient contexts (= query sequences) sampled by this worker.
n_contexts: 4096

# Each sequence is Uniform{min..max} i.i.d. queries (random code incl. TIMELINE//END, random
# duration), fully random order — no privileged censor position.
min_queries: 1
max_queries: 5

# Duration distribution bounds (log-uniform over integer days).
duration_min: 1
duration_max: 731

# Minimum prior events a subject must have accumulated before a prediction time is valid.
min_context_per_subject: 50

# --- Phase-2 sweep knobs (default OFF: fully random baseline) ---
# Probability a sequence is forced to start with the TIMELINE//END query (upweights the
# censoring-control pattern).  0.0 = pure random.
eos_first_fraction: 0.0
# Duration coupling within a sequence: random | same | nondecreasing.
duration_mode: random

overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
