# Hydra config for the dense evaluation grid of the all-vocabulary *multitask* model
# (`EQ_generate_evaluation_multitask_sequences`).
#
# The multitask counterpart of `sample_evaluation_query_sequences_config.yaml`, with the same shape:
# `num_evaluation_tasks` task specifications are drawn ONCE per task group - seeded independently of
# the cohort - and labeled at every sampled prediction time of `split`, so every context answers the
# identical set of tasks and per-task metrics are comparable across cohorts and across models.
#
# One task = one context's worth of the training sampler's draw (K windows, each with an explicit
# start and end spec, plus the K-1 conditioning codes) PLUS a `target_code`: the vocabulary code
# whose probability at the FINAL window is what a metric is computed on.
#
#   [W0, C0, A0, ..., W(K-1)]  ->  P(target_code occurs inside window K-1 | history, prior answers)
#
# All shards under `{data_dir}/data/{split}/*.parquet` are discovered and processed in one
# invocation (one output parquet per shard) - there is no shard knob.
#
# Path roots are machine-specific, **required** Hydra args - no `.env`/env-var fallback.  Pass them
# on the CLI as shell-expanded vars:
#   data_dir=$TOKENIZED_EVENTS_DIR out_dir=$EVAL_MULTITASK_DIR query_codes=$TENSORIZED_COHORT_DIR
#
#   data_dir     MEDS dataset root (event shards under `{data_dir}/data/{split}/*.parquet`)
#   out_dir      output root (layout below).  Give it a root distinct from the training sampler's.
#   query_codes  the cohort's vocabulary: a metadata root dir (loads `{dir}/metadata/codes.parquet`)
#                or a direct `codes.parquet` path.  Bits are aligned to that file's unchanged
#                `code/vocab_index`, exactly as in `sample_multitask_sequences_config.yaml`.
#
# Output layout (`{out_dir}/eval` is directly usable as `EQ_predict_multitask tasks_dir=...`):
#   {out_dir}/eval/{split}/{shard}.parquet          MultitaskBoundarySchema metadata rows
#   {out_dir}/eval/{split}/{shard}.labels.npy       uint8 (rows, K, ceil(V/8)) packed targets
#   {out_dir}/eval/{split}/_multitask_manifest.json vocabulary + semantics the bits were built under
#   {out_dir}/eval_meta/{split}/{shard}.parquet     row-aligned sidecar: task_id, task_group,
#                                                   target_code, and per-window start_resolved /
#                                                   end_resolved / window_days diagnostics
#   {out_dir}/eval_tasks.parquet                    the task specifications themselves
#   {out_dir}/_eval_summary.json                    row counts + the grid's fingerprint

data_dir: ???
out_dir: ???
query_codes: ???

split: held_out # typical inference split; use `tuning` for intermediate validation.
seed: 1

# --- The cohort (identical knobs to sample_evaluation_query_sequences_config.yaml) -------------
# How many prediction times to sample per subject.  The grid is
# `prediction_times_per_subject x num_evaluation_tasks x n_task_groups` rows per subject, and each
# row carries K x ceil(V/8) bytes of packed targets - so this knob and
# `subject_subsample_fraction` are the two that decide the grid's size on disk.
prediction_times_per_subject: 1

# Minimum prior events a subject must have accumulated before a prediction time is valid.
min_context_per_subject: 50

# Optional subject subsample: a float in (0, 1] applies a deterministic per-subject hash-threshold
# filter, so the expected fraction is honored regardless of shard size and is a uniform global
# subsample (subject IDs are disjoint across shards).  Values outside (0, 1] raise.  null disables.
subject_subsample_fraction: null

# --- The task specifications ------------------------------------------------------------------
# Tasks drawn per group.  Every group draws this many, so the grid holds
# `num_evaluation_tasks * len(task_groups)` tasks in total.
num_evaluation_tasks: 40

# Each entry draws its own `num_evaluation_tasks` specifications, differing ONLY in how the event
# boundary and event start codes are drawn from the vocabulary.  Every group shares the contexts, so
# a model's numbers on two groups are directly comparable.  An entry is either a bare name
# (`uniform` => no weighting) or a mapping {name, code_weighting, code_weight_power}; the power falls
# back to `code_weight_power` below.  Each group is seeded on (seed, "eval_multitask_specs", split,
# name), so adding or reordering a group never perturbs another group's draw.
task_groups:
  - uniform
  - {name: prevalence, code_weighting: prevalence, code_weight_power: 1.0}

# --- The window distribution the specs are drawn from -----------------------------------------
# These mirror `sample_multitask_sequences_config.yaml` key for key: an evaluation grid drawn from a
# different window distribution than training's is not an error, it is a silent metric shift, so
# pass the same overrides here that the checkpoint was trained with.
num_bounds: 5

duration_min: 1
duration_max: 1826
duration_distribution: log-uniform # uniform | log-uniform

eventbound_fraction: 0.5
boundary_codes: null

eventstart_fraction: 0.2
prediction_time_start_fraction: 0.4
start_duration_min: 1
start_duration_max: 180
start_duration_distribution: log-uniform # uniform | log-uniform
start_event_codes: null

# Shared weighting policy for any group that asks for it, and for the target codes below.
code_weight_column: code/n_occurrences # code/n_occurrences | code/n_subjects
code_weight_power: 1.0

# Removed from the boundary, start-event AND target pools (never from the conditioning codes or the
# labeled vocabulary).  See `sample_multitask_sequences_config.yaml` for why TIMELINE//DELTA is the
# usual entry.
exclude_boundary_prefixes: []

# --- The scored target code -------------------------------------------------------------------
# The code whose probability at the final window is the number metrics are computed on.  This is
# deliberately NOT part of what `task_groups` varies: it decides whether a task's labels are
# informative at all, and must be identical across groups for their metrics to be comparable.
#
# Drawn uniformly over the vocabulary, most target codes never occur for anybody, so most tasks have
# no positives and no defined AUROC; drawn strictly proportional to prevalence, most occur for
# nearly everybody.  The default - prevalence, square-root damped - spreads base rates across the
# usable middle.  `target_codes` optionally restricts the pool (null => the whole base vocabulary
# minus `exclude_boundary_prefixes`).
target_codes: null
target_code_weighting: prevalence # null | prevalence
target_code_weight_power: 0.5

# --- Execution ---------------------------------------------------------------------------------
# Cap on the worker pool; null => cores on this node.  Each worker holds one event shard, its
# interval table and a `label_chunk_rows x num_bounds x V` boolean scratch.
max_workers: null
label_chunk_rows: 2000

# MVP: observable leaf codes only, exactly as in the training sampler.
ontology_dir: null
overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
