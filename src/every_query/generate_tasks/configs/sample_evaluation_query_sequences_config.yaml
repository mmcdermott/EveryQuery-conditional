# Hydra config for the dense-grid conditional query-*sequence* evaluation generator.
#
# Sibling to `sample_query_sequences_config.yaml` (scattered shape: every context draws its
# own independent sequence).  This endpoint labels the *same* N query sequences at every context
# of one cohort — the row shape per-sequence metrics need.  Both axes of that grid are either
# supplied or sampled: `contexts_path`/`n_contexts` for the cohort, `sequences_path`/`n_sequences`
# for the N sequences.  With all four left at their defaults the endpoint runs on the three path
# roots alone.
#
# Relationship to `sample_evaluation_tasks_config.yaml`: same dense-grid motivation, but that
# one emits flat TaskQuerySchema rows for EQ_predict/EQ_evaluate, while this one emits
# QuerySeqSchema rows (queries/durations/answers list columns) for EQ_predict_sequences.
#
# Path roots are machine-specific, **required** Hydra args — no `.env`/env-var fallback (#235).
# Pass them on the CLI as shell-expanded vars:
#   data_dir=$TOKENIZED_EVENTS_DIR out_dir=$EVAL_TASKS_DIR query_codes=$TENSORIZED_COHORT_DIR
#
#   data_dir     MEDS dataset root (event shards under `{data_dir}/data/{split}/*.parquet`;
#                every cohort subject must be present in `split`)
#   out_dir      final-output-only root (layout below)
#   query_codes  vocabulary: a metadata root dir (loads `{dir}/metadata/codes.parquet`), an
#                explicit Hydra list, or a YAML/parquet path.  With `sequences_path` set it is
#                used only to reject codes outside the model's vocabulary.
#
# All three are `???` (mandatory).  The intermediate-artifacts root has no key of its own: it is
# always the sibling `{parent}/{name}_artifacts` of out_dir, never nested under it (invariant 7).
# A sampled cohort writes Stage 0's map there; a supplied one writes no intermediates at all:
#
#   out_dir/{split}/...                      <- final outputs ONLY (layout below)
#   {name}_artifacts/{split}/
#       _prediction_time_counts.parquet      <- Stage 0 summary   (sampled cohort only)
#       _prediction_times/{shard}.parquet    <- Stage 0 map       (sampled cohort only)
#
# Output layout (both directly usable as `EQ_predict_sequences tasks_dir=...`):
#   per_spec_dirs=false  ->  {out_dir}/{split}/{contexts_tag}__{specs_tag}.parquet
#   per_spec_dirs=true   ->  {out_dir}/{spec_name}/{split}/tasks.parquet
# where `contexts_tag` is the cohort file's stem or `sampled{n_contexts}ctx`, and `specs_tag` the
# spec file's stem or `sampled{n_sequences}`.

data_dir: ???
out_dir: ???
query_codes: ???

split: held_out # typical inference split; use `tuning` for intermediate validation.
seed: 1

# --- The cohort -----------------------------------------------------------
# Parquet with at least (subject_id, prediction_time).  Extra columns are dropped; duplicate
# contexts are deduped (a dense grid asks each sequence about each context exactly once).  Every
# subject in it must be present in `split`, or labeling raises rather than answering all-False.
# Leave null to instead sample the cohort from `split` itself (the two knobs below).
contexts_path: null

# Contexts to draw when `contexts_path` is null, via the same upstream Stages 0 + 2 the training
# sampler uses (seeded on the same "contexts" axis), so an evaluation grid is scored at contexts
# from the distribution training drew from.  Stage 2 draws with replacement and the repeats are
# deduped, so this is a *ceiling* on the grid's width, not an exact count.  Unlike the training
# sampler's `num_sequences`, it is a context budget, not a row budget: the grid ends up with
# `n_contexts x n_sequences` labeled rows, so raise it with that product in mind.
n_contexts: 512

# Minimum prior *prediction times* (distinct (subject_id, time) rows, NOT events) required before
# a prediction time is eligible for the draw.  Governs Stage 0 eligibility and the Stage 2 draw
# range; matches `sample_query_sequences_config.yaml`, and is ignored for a supplied cohort.
min_prediction_times_per_subject: 50

# --- The N query sequences ------------------------------------------------
# Path to designed sequences.  Leave null to instead draw `n_sequences` of them from the
# training query distribution (see the sampling knobs below).
sequences_path: null
#
# `sequences_path` accepts any of:
#   YAML/JSON mapping    name -> [[code, duration], ...]     (names become output dir names)
#   YAML/JSON list       [[[code, duration], ...], ...]      (names auto-generated)
#   long-format parquet  (seq_id, position, query, duration_days)
# e.g. designed.yaml:
#   mortality_30d:
#     - [TIMELINE//END, 1]
#     - [MEDS_DEATH, 30]
# On this path nothing is sampled: the codes and durations are exactly what you wrote, and
# `query_codes` is used only to reject codes outside the model's vocabulary.

# --- Sampling knobs (all `sequences_path: null` only) ---------------------
# The code and duration distributions below mirror `sample_query_sequences_config.yaml` so a
# sampled evaluation grid is drawn from the same distribution the model was pretrained on.
# If your checkpoint was trained with overrides, pass the same overrides here — an
# out-of-distribution horizon shows up as an unexplained metric shift, not as an error.

# Number of sequences to draw.  They are drawn once and shared across every cohort context.
n_sequences: 64

# Sequence length ~ Uniform{min_queries..max_queries} inclusive, per sequence.  Fixed at 3
# rather than training's 1..5 range: one length keeps the grid simple and makes per-position
# comparisons across sequences clean (every sequence has a position 0, 1 and 2).  Still in
# distribution, since 3 is inside the range the model was trained on — unlike the duration
# bounds below, widening/narrowing these does not move the grid off-distribution as long as
# they stay within `[training min_queries, training max_queries]`.
min_queries: 3
max_queries: 3

# Duration bounds in days.  Each query's horizon is drawn log-uniformly over the continuous
# [min, max] interval and kept as a **float** (no day-rounding) — so it skews short: over
# 1..731 the median is ~27d and ~52% of horizons are <= 30d.
# These three must stay byte-equal to `sample_query_sequences_config.yaml` (a test asserts it):
# both sides feed the same `QueryDistribution`, so any drift silently makes the eval grid
# out-of-distribution and reads as an unexplained metric shift rather than an error.
duration_min: 1
duration_max: 731
duration_distribution: log-uniform # uniform | log-uniform

# Codes are drawn per query (not per sequence) iid uniform over `query_codes`, with
# replacement — a code can repeat within a sequence, and TIMELINE//END is an ordinary member,
# so it lands on any given query with probability 1/|vocab|.  `eos_first_fraction` forces
# position 0 to be the end-of-timeline query that often instead.  `duration_mode` couples
# horizons within a sequence: random | same | nondecreasing.
eos_first_fraction: 0.0
duration_mode: random

# --- Event-bounded duration queries -----------------------------------------------------------
# Must mirror sample_query_sequences_config.yaml exactly (the two are asserted key-identical on
# every sampling knob): a knob that drifts between the training sampler and the eval grid
# silently invalidates the grid.  See that file for the full explanation.
#
# Fraction of *sampled* eval queries that are event-bounded; the boundary is drawn uniformly from
# the query universe (leaves plus, with `ontology_dir`, ancestor nodes).  Designed specs set their
# bounds explicitly instead, via a `[code, -1, bound_event]` triple.
eventbound_fraction: 0.0

# --- Ontology / hierarchical embeddings ---------------------------------------------------------
# Directory of ontology artifacts written by EQ_build_ontology (nodes/mix/closure parquets).
# Set it to put every ancestor NODE into the query universe — each leaf and each ancestor is then
# drawn with equal probability, as a query and as an event boundary — and to explode the event
# stream through the closure so an ancestor query is labelled by ordinary occurrence ("did any
# descendant of X occur").  null = off (leaf codes only).  Must be the SAME directory the model is
# trained with — the indices have to agree, or a query would address the wrong embedding row.
ontology_dir: null

# Write one output dir per sequence (`{out_dir}/{spec_name}/{split}/tasks.parquet`) instead of
# one combined parquet.  Useful with designed, named sequences: each dir is independently
# scoreable, so per-task metrics need no post-hoc grouping.  With the combined file, sequence
# identity is recoverable from the queries/durations columns, or from row order — row i is
# (contexts[i // N], specs[i % N]).
per_spec_dirs: false

overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
