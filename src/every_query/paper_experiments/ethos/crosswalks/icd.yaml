# LLM-proposed crosswalk: EQ ICD codes -> ETHOS descriptive ICD//CM labels.
#
# Each entry maps an EQ ICD code (DIAGNOSIS//ICD//<edition>//<code> or
# PROCEDURE//ICD//<edition>//<code>) to one or more ETHOS tokens. Multiple
# tokens are OR-ed at match time. The rationale is committed for audit.
#
# Provenance: hand-curated by Claude using clinical knowledge against the
# vocab seen in `gs://every-query-runs/baselines/ethos/ethos_vocab.parquet`.
# These mappings should be reviewed before being treated as authoritative.

mappings:
  - eq_code: DIAGNOSIS//ICD//9//3320
    eq_meaning: "Parkinson's disease"
    ethos_tokens:
      - "ICD//CM//PARKINSON'S_DISEASE"
    source: "llm:claude_clinical_knowledge"
    rationale: "Direct semantic match to ICD-10 G20."

  - eq_code: DIAGNOSIS//ICD//9//4271
    eq_meaning: "Paroxysmal supraventricular tachycardia"
    ethos_tokens:
      - "ICD//CM//PAROXYSMAL_TACHYCARDIA"
    source: "llm:claude_clinical_knowledge"
    rationale: "Direct match to ICD-10 I47."

  - eq_code: DIAGNOSIS//ICD//9//5856
    eq_meaning: "End-stage renal disease (ESRD)"
    ethos_tokens:
      - "ICD//CM//CHRONIC_KIDNEY_DISEASE_(CKD)"
    source: "llm:claude_clinical_knowledge"
    rationale: >-
      ICD-9 585.6 is ESRD; ICD-10 N18 is CKD with N18.6 specifically being ESRD.
      ETHOS's CKD label captures the N18 family. Alternative tokens (HCPCS
      UNSCHED_DIALYSIS_ESRD_PT_HOS, ENCOUNTER_FOR_CARE_INVOLVING_RENAL_DIALYSIS)
      are too rare to be useful as standalone matches.

  - eq_code: DIAGNOSIS//ICD//10//I25118
    eq_meaning: >-
      Atherosclerotic heart disease of native coronary artery
      with other forms of angina pectoris
    ethos_tokens:
      - "ICD//CM//CHRONIC_ISCHEMIC_HEART_DISEASE"
    source: "llm:claude_clinical_knowledge"
    rationale: >-
      I25.118 is a 5-digit child of I25 (chronic ischemic heart disease).
      ICD//CM//CHRONIC_ISCHEMIC_HEART_DISEASE is the I25 3-char category
      and is the tightest ETHOS bridge that still covers the EQ concept.
      Earlier candidates ANGINA_PECTORIS (I20, angina without specified
      atherosclerosis) and ATHEROSCLEROSIS (I70, mostly peripheral and leg
      atherosclerosis, not coronary) were dropped during precision review
      since they overshoot the EQ concept.

  - eq_code: PROCEDURE//ICD//9//7936
    eq_meaning: >-
      Open reduction of fracture without internal fixation,
      metatarsal and tarsal bones (foot)
    ethos_tokens:
      - "ICD//CM//FRACTURE_OF_FOOT_AND_TOE_EXCEPT_ANKLE"
    source: "llm:claude_clinical_knowledge"
    rationale: >-
      ETHOS uses chunked ICD-PCS tokens that don't carry procedure semantics
      directly. We map this procedure to the underlying fracture diagnosis
      as a proxy: predicting the fracture diagnosis is a reasonable proxy
      for the reduction procedure. The previously-OR'd
      FRACTURE_OF_LOWER_LEG_INCLUDING_ANKLE was dropped during precision
      review since it covers different anatomy than the foot-bone procedure.
      Mapping is still loose -- AUC interpretation should reflect that we're
      predicting the indication, not the procedure itself.

# Codes intentionally omitted -- no ETHOS counterpart available under any
# reasonable mapping in the current vocabulary. Documented for the audit
# trail rather than mapped speculatively.
unmappable_with_rationale:
  - eq_code: DIAGNOSIS//ICD//9//7295
    description: "Pain in soft tissues of limb (ICD-9 729.5)"
    reason: >-
      ETHOS has no specific limb-pain or musculoskeletal-pain ICD-10-CM
      3-char category. The previously-proposed proxies
      OTHER_DISORDERS_OF_MUSCLE (M62, generic muscle disorder grab-bag) and
      PAIN_NOT_ELSEWHERE_CLASSIFIED (R52, unspecified pain) were dropped
      during precision review -- both overshoot to unrelated conditions and
      neither captures the limb-specific clinical concept.
