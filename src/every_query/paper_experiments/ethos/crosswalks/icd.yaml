# Generated by build_crosswalks.py: EQ ICD codes -> ETHOS descriptive ICD//CM
# tokens.
#
# DIAGNOSIS rows are produced by the deterministic ICD-10-CM 3-char
# walker in ontology.icd_to_ethos_token; the LLM picker is invoked only
# when an ICD-9 code crosswalks to multiple distinct 3-char parents.
# PROCEDURE rows are LLM-only since ETHOS encodes no PCS tokens; the
# candidate list is seeded by name overlap with the procedure's source
# concept name. Each entry commits exactly one ETHOS token.

mappings:
- eq_code: DIAGNOSIS//ICD//10//I25118
  eq_meaning: Atherosclerotic heart disease of native coronary artery with other forms of
    angina pectoris
  ethos_tokens:
  - ICD//CM//CHRONIC_ISCHEMIC_HEART_DISEASE
  source: deterministic:icd_3char_walker
  rationale: ICD-10-CM 3-char parent I25 resolved to ETHOS token via ethos_icd_3char_index.
- eq_code: DIAGNOSIS//ICD//9//3320
  eq_meaning: Paralysis agitans
  ethos_tokens:
  - ICD//CM//PARKINSON'S_DISEASE
  source: deterministic:icd_3char_walker
  rationale: ICD-10-CM 3-char parent G20 resolved to ETHOS token via ethos_icd_3char_index.
- eq_code: DIAGNOSIS//ICD//9//4271
  eq_meaning: Paroxysmal ventricular tachycardia
  ethos_tokens:
  - ICD//CM//PAROXYSMAL_TACHYCARDIA
  source: llm:diagnosis_walker_unresolved
  rationale: While the EQ code specifically refers to ventricular tachycardia and the ETHOS
    token represents the broader category of paroxysmal tachycardia (which includes both ventricular
    and supraventricular types), this is the only available candidate and paroxysmal ventricular
    tachycardia is a subset of paroxysmal tachycardia. The mapping loses some specificity
    but remains clinically valid.
- eq_code: DIAGNOSIS//ICD//9//5856
  eq_meaning: End stage renal disease
  ethos_tokens:
  - ICD//CM//CHRONIC_KIDNEY_DISEASE_(CKD)
  source: deterministic:icd_3char_walker
  rationale: ICD-10-CM 3-char parent N18 resolved to ETHOS token via ethos_icd_3char_index.
- eq_code: DIAGNOSIS//ICD//9//7295
  eq_meaning: Pain in limb
  ethos_tokens:
  - ICD//CM//OTHER_AND_UNSPECIFIED_SOFT_TISSUE_DISORDERS_NOT_ELSEWHERE_CLASSIFIED
  source: deterministic:icd_3char_walker
  rationale: ICD-10-CM 3-char parent M79 resolved to ETHOS token via ethos_icd_3char_index.
- eq_code: PROCEDURE//ICD//9//7936
  eq_meaning: Open reduction of fracture with internal fixation, tibia and fibula
  ethos_tokens:
  - ICD//CM//FRACTURE_OF_LOWER_LEG_INCLUDING_ANKLE
  source: llm:no_pcs_tokens_in_ethos
  rationale: The EQ code describes a procedure for open reduction with internal fixation of
    tibia and fibula fractures. The tibia and fibula are the two bones of the lower leg, which
    directly corresponds to the ETHOS token for fractures of the lower leg including ankle
    (S82).
