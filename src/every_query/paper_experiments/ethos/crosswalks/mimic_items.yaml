# Generated by build_crosswalks.py: EQ MIMIC-item codes -> ETHOS tokens.
#
# INFUSION rows resolve the item-id to a drug-name label and walk to ATC
# via ontology.atc_to_ethos_token. LAB and SUBJECT_FLUID_OUTPUT rows are
# limited to orphan codes (base form not in the ETHOS vocab, so
# build_mapping's drop_bin / quantile tiers cannot match) and are
# resolved by the LLM picker with diagnosis-token candidates seeded by
# name overlap. TIMELINE//START is a direct mapping. Codes the LLM
# declined are listed in unmappable_with_rationale at the bottom.

mappings:
- eq_code: INFUSION_END//229420//value_[10.687433,23.27545)
  eq_meaning: Dexmedetomidine (Precedex) (MIMIC item 229420)
  ethos_tokens:
  - ATC//N05//PSYCHOLEPTICS
  source: llm:infusion_walker_unresolved
  rationale: Dexmedetomidine is a sedative agent used for procedural sedation and ICU sedation.
    It falls under ATC class N05 (psycholeptics/sedatives), which is the most semantically
    appropriate match in the ETHOS vocabulary for this alpha-2 agonist sedative medication.
- eq_code: INFUSION_START//221794//value_[8.004926,10.000001)
  eq_meaning: Furosemide (Lasix) (MIMIC item 221794)
  ethos_tokens:
  - ATC//C03//DIURETICS
  source: deterministic:atc_ancestor_walker
  rationale: RxNorm ingredient 'furosemide' walks to ATC C03 via OHDSI CONCEPT_ANCESTOR.
- eq_code: LAB//228724//cm//value_[1.5,2.0)
  eq_meaning: 'Pressure ulcer #2- Length (MIMIC LAB 228724, units=cm)'
  ethos_tokens:
  - ICD//CM//PRESSURE_ULCER
  source: llm:orphan_lab
  rationale: 'The EQ code explicitly measures the length of pressure ulcer #2, making it a
    direct measurement related to pressure ulcers. The ICD-10-CM code L89 for Pressure Ulcer
    is the most semantically specific and faithful match among the candidates.'
- eq_code: TIMELINE//START
  eq_meaning: Start of patient record / first event token
  ethos_tokens:
  - HOSPITAL_ADMISSION
  source: direct:event_alignment
  rationale: EQ's TIMELINE//START fires at the first event of a patient's record; ETHOS uses
    HOSPITAL_ADMISSION as its admission marker.
unmappable_with_rationale:
- eq_code: INFUSION_END//227536//value_[6.05,8.071587)
  description: KCl (CRRT) (MIMIC item 227536)
  reason: 'LLM proposed ''LAB//227536//mEq/L'' which is not in the ETHOS vocab; original rationale:
    This represents a potassium chloride (KCl) measurement during continuous renal replacement
    therapy (CRRT), which is a laboratory value. The MIMIC item 227536 corresponds to a serum
    potassium lab result, typically measured in mEq/L, making it appropriately mapped to the
    LAB namespace with the same identifier.'
- eq_code: INFUSION_END//227536//value_[8.071587,9.379999)
  description: KCl (CRRT) (MIMIC item 227536)
  reason: 'LLM proposed ''LAB//227536//mEq/L'' which is not in the ETHOS vocab; original rationale:
    This represents a potassium chloride (KCl) infusion measurement during continuous renal
    replacement therapy (CRRT), which is a laboratory value tracking serum potassium levels.
    The value range [8.071587,9.379999) appears to represent potassium concentration in mEq/L,
    making this appropriately mapped to a LAB token with the MIMIC item ID and standard potassium
    units.'
- eq_code: INFUSION_START//220949
  description: Dextrose 5% (MIMIC item 220949)
  reason: Dextrose 5% is an intravenous fluid used for hydration and as a vehicle for medication
