# Generated by build_crosswalks.py: EQ MEDICATION codes -> ETHOS ATC tokens.
#
# Rows are produced by the deterministic ATC ancestor walker in
# ontology.atc_to_ethos_token. When the RxNorm ingredient sits in two
# ATC chains under one source concept (e.g. Mupirocin R01/D06) both
# leaves are committed; otherwise ties are resolved by the LLM picker.

mappings:
- eq_code: MEDICATION//Carbidopa-Levodopa (25-100)//Administered
  eq_meaning: Carbidopa-Levodopa (25-100)
  ethos_tokens:
  - ATC//N04//ANTI-PARKINSON_DRUGS
  source: deterministic:atc_ancestor_walker
  rationale: RxNorm ingredient 'levodopa' walks to ATC N04 via OHDSI CONCEPT_ANCESTOR.
- eq_code: MEDICATION//Gabapentin//Delayed Administered
  eq_meaning: Gabapentin
  ethos_tokens:
  - ATC//N02//ANALGESICS
  - ATC//N03//ANTIEPILEPTICS
  source: deterministic:atc_same_source_concept_tie
  rationale: RxNorm ingredient 'gabapentin' (concept_id=797399) sits in two distinct ATC chains;
    both are committed since they reflect the same source concept.
- eq_code: MEDICATION//START//Mupirocin Nasal Ointment 2%
  eq_meaning: Mupirocin Nasal Ointment 2%
  ethos_tokens:
  - ATC//R01//NASAL_PREPARATIONS
  source: llm:atc_multi_chain
  rationale: Mupirocin Nasal Ointment 2% is specifically formulated for nasal application,
    making R01 (Nasal Preparations) the most semantically specific match. While mupirocin
    is an antibiotic that could fall under D06 for dermatological use, the nasal formulation
    and route of administration makes R01 the most faithful representation of this specific
    product.
- eq_code: MEDICATION//STOP//Captopril
  eq_meaning: Captopril
  ethos_tokens:
  - ATC//C09//AGENTS_ACTING_ON_THE_RENIN-ANGIOTENSIN_SYSTEM
  source: deterministic:atc_ancestor_walker
  rationale: RxNorm ingredient 'captopril' walks to ATC C09 via OHDSI CONCEPT_ANCESTOR.
- eq_code: MEDICATION//STOP//Doxycycline Hyclate
  eq_meaning: Doxycycline Hyclate
  ethos_tokens:
  - ATC//J01//ANTIBIOTICS_AND_ANTIBACTERIALS_FOR_SYSTEMIC_USE
  source: llm:medication_walker_unresolved
  rationale: 'LLM proposed ''ATC//J01//ANTIBACTERIALS_FOR_SYSTEMIC_USE''; salvaged to canonical
    ETHOS token ''ATC//J01//ANTIBIOTICS_AND_ANTIBACTERIALS_FOR_SYSTEMIC_USE'' via unique namespace-prefix
    match. Original rationale: Doxycycline hyclate is a tetracycline antibiotic used systemically
    for bacterial infections. The ATC level-3 class J01 (Antibacterials for Systemic Use)
    is the most semantically appropriate match, as ETHOS tokens do not appear to include specific
    drug ingredients or brand formulations, only therapeutic drug classes.'
