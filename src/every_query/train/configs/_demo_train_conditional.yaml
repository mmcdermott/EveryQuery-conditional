# Minimal Hydra config for CPU-only integration tests of the conditional query-sequence model.
#
# Usage (tests override the ??? paths via Hydra CLI):
#   EQ_train --config-name=_demo_train_conditional \
#       output_dir=/tmp/cq_test \
#       datamodule.config.task_labels_dir=/tmp/seq_tasks \
#       datamodule.config.tensorized_cohort_dir=/tmp/cohort

defaults:
  - _self_

output_dir: ???
do_overwrite: true
do_resume: false
seed: 1

datamodule:
  # Match production (conditional_config.yaml): the stateful loader, so the demo run exercises
  # the same train_dataloader path.
  _target_: every_query.data.datamodule.ResumableDatamodule
  data_class: every_query.data.seq_dataset.ConditionalQueryPytorchDataset
  config:
    _target_: meds_torchdata.MEDSTorchDataConfig
    tensorized_cohort_dir: ???
    task_labels_dir: ???
    static_inclusion_mode: omit
    seq_sampling_strategy: to_end
    max_seq_len: 64
    batch_mode: SM
  # Mirror production's feature-toggle surface: both dataset-side toggles interpolate from the
  # model-side knobs exactly as `conditional_config.yaml` does, so an integration test that sets
  # `lightning_module.model.use_rope_time` / `.ontology_dir` switches the dataset with it (a
  # literal `false` / `null` here left the dataset on the un-featured path while the model
  # expected RoPE positions and ancestor vocabulary).
  dataset_kwargs:
    strip_delta_tokens: ${lightning_module.model.use_rope_time}
    ontology_dir: ${lightning_module.model.ontology_dir}
  batch_size: 2
  num_workers: 0
  pin_memory: false

lightning_module:
  _target_: every_query.model.conditional_lightning.ConditionalQueryLightningModule
  model:
    _target_: every_query.model.conditional_model.ConditionalQueryEncoderDecoderModel
    precision: ${trainer.precision}
    mlp_dropout: 0.1
    use_rope_time: false
    ontology_dir: null
    decoder_layers: 2
    decoder_heads: 2
    decoder_ffn_mult: 2
    max_queries: 8
    config_overrides:
      hidden_size: 64
      num_hidden_layers: 2
      num_attention_heads: 2
      intermediate_size: 128
      # Dictated by the data — filled in by train.py from the datamodule config.
      max_position_embeddings: ???
      vocab_size: ???
      pad_token_id: 0
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    weight_decay: 0.01
  LR_scheduler: null

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  logger: false
  callbacks:
    _target_: every_query.train.train.values_as_list
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${output_dir}/checkpoints
      monitor: "tuning/loss"
      verbose: false
      save_last: true
      save_top_k: 1
      mode: "min"
      save_weights_only: false
  default_root_dir: ${output_dir}
  min_epochs: 0
  max_epochs: 1
  accelerator: cpu
  devices: 1
  precision: "bf16-mixed"
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  check_val_every_n_epoch: null
  val_check_interval: 1
  limit_val_batches: 2
  deterministic: true
  gradient_clip_val: 1.0
