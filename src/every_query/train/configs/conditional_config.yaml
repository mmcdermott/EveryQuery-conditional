# Training config for the conditional query-sequence model (ConditionalQueryModel).
#
# Differences vs. config.yaml (single-query EveryQuery):
#   - datamodule.data_class points at ConditionalQueryPytorchDataset (query-sequence labels);
#   - lightning_module instantiates ConditionalQueryLightningModule / ConditionalQueryModel;
#   - encoder is sized from config_overrides for a from-scratch EHR vocabulary (the
#     ModernBERT-base defaults are for a 50k-token text vocab and 22 layers);
#   - logger is a local CSVLogger (training-stability curves are read from metrics.csv).
#
# `vocab_size` / `max_position_embeddings` are `???` on purpose: train.py sizes them from the
# tensorized cohort (metadata/codes.parquet and datamodule.config.max_seq_len) before the config
# is saved, so any value written here would be silently overwritten.

defaults:
  - _self_

output_dir: ??? # required base — supply via `output_dir=`; Hydra appends <date>/<time> (see hydra block)
do_overwrite: false
do_resume: false
seed: 140799

# Uniqueness comes from Hydra's native run/sweep dir (not the retired `${run_id:}` resolver, dropped
# upstream in f3d50eb): each launch lands in ${output_dir}/<date>/<time>.  ${now:} is fixed once per
# launch, so run.dir and sweep.dir share one timestamp.  Reuse the same output_dir across runs.
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    config:
      override_dirname:
        # keep only the swept hyperparameters in the subdir name — drop the always-present path args
        # (their `/` would otherwise nest the sweep folders).
        exclude_keys:
          - output_dir
          - datamodule.config.tensorized_cohort_dir
          - datamodule.config.task_labels_dir

datamodule:
  # Stateful train loader: with max_epochs=1 a `do_resume` must pick up mid-epoch (see
  # every_query.data.datamodule.ResumableDatamodule).
  _target_: every_query.data.datamodule.ResumableDatamodule
  data_class: every_query.data.seq_dataset.ConditionalQueryPytorchDataset
  config:
    _target_: meds_torchdata.MEDSTorchDataConfig
    # Required Hydra args — no `.env`/env-var fallback (#235).  Pass shell-expanded vars:
    #   datamodule.config.tensorized_cohort_dir=$TENSORIZED_COHORT_DIR
    #   datamodule.config.task_labels_dir=$TRAINING_TASKS_DIR
    tensorized_cohort_dir: ???
    task_labels_dir: ???
    static_inclusion_mode: omit
    seq_sampling_strategy: to_end
    max_seq_len: 256
  # Dataset-side feature toggles (see every_query.data.datamodule.ResumableDatamodule).
  # `strip_delta_tokens` drops the quantized TIMELINE//DELTA* tokens from the encoder input and
  # emits per-token elapsed-hour `time_pos_ids`; it must be set together with
  # `lightning_module.model.use_rope_time` below, which is what consumes them.
  dataset_kwargs:
    strip_delta_tokens: false
  batch_size: 96
  num_workers: 8
  pin_memory: True

lightning_module:
  _target_: every_query.model.conditional_lightning.ConditionalQueryLightningModule
  # One answer head means one loss, so this throttles the cheap total-grad-norm log in
  # `on_before_optimizer_step` — not upstream's two extra autograd passes.  Every step is fine.
  grad_norm_log_every_n_steps: 1
  model:
    _target_: every_query.model.conditional_model.ConditionalQueryModel
    precision: ${trainer.precision} # single source of truth: the Trainer owns AMP
    mlp_dropout: 0.1
    num_hidden_layers: 8
    decoder_layers: 4
    decoder_heads: 6
    decoder_ffn_mult: 4
    max_queries: 8
    # Time representation.  false = ModernBERT's default token-index rotary positions, with
    # elapsed time carried by the TIMELINE//DELTA* tokens in the stream.  true = rotary
    # positions are elapsed hours and the delta tokens are stripped; requires
    # `datamodule.dataset_kwargs.strip_delta_tokens=true` to supply them.
    use_rope_time: false
    config_overrides:
      hidden_size: 384
      num_attention_heads: 6
      intermediate_size: 1536
      # Dictated by the data — filled in by train.py from the datamodule config.
      max_position_embeddings: ???
      vocab_size: ???
      pad_token_id: 0
      cls_token_id: 1
      bos_token_id: 1
      sep_token_id: 2
      eos_token_id: 2
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 2e-4
    weight_decay: 0.05
    eps: 1.0e-8
    betas: [0.9, 0.98]
    amsgrad: false
    fused: false
  # Fraction of total optimizer steps spent in LR warmup; the module derives the actual step
  # counts from trainer.estimated_stepping_batches at fit time and passes them to the scheduler
  # factory, which is why `num_warmup_steps`/`num_training_steps` are *not* declared below.
  warmup_ratio: 0.05
  LR_scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    _partial_: true
    num_cycles: 0.5

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: "${trainer.default_root_dir}/loggers"
    name: "csv"
    flush_logs_every_n_steps: 50
  callbacks:
    _target_: every_query.train.train.values_as_list
    learning_rate_monitor:
      _target_: lightning.pytorch.callbacks.LearningRateMonitor
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${trainer.default_root_dir}/checkpoints
      monitor: "tuning/loss"
      verbose: False
      save_last: True
      save_top_k: 2
      mode: "min"
      save_weights_only: False
      every_n_train_steps: null
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: "tuning/loss"
      min_delta: 5.0e-5
      patience: 20
      verbose: True
      mode: "min"
      strict: True
      check_finite: True
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: false
  default_root_dir: ${hydra:runtime.output_dir} # single source of truth: run.dir OR sweep.dir/subdir
  min_epochs: 0 # prevents early stopping
  max_epochs: 1 # total steps come from the data: one pass over the train set
  accelerator: "auto"
  devices: 1
  strategy: "auto"
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  val_check_interval: 0.05 # validate 20 times per epoch
  limit_val_batches: 100
  deterministic: False
  gradient_clip_val: 1.0
  precision: "bf16-mixed"
